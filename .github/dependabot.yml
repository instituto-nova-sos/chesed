# DEPENDABOT PAUSED (2026-06-03) — Phase 1 cost-control measure.
#
# CI workflows are disabled (see .github/workflows/*.yml). New dependency PRs
# would queue without being verified, so Dependabot is paused by setting
# `open-pull-requests-limit: 0` on every ecosystem. The schedule + grouping
# config is preserved so re-enabling later is just a number change.
#
# To re-enable: restore the original limits (5 / 5 / 3) on each ecosystem
# below AND re-enable the corresponding workflow triggers.
# See CLAUDE.md "CI/CD Status — PAUSED" for the policy and re-enable steps.

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "backend"
    open-pull-requests-limit: 0  # paused — original: 5
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "frontend"
    open-pull-requests-limit: 0  # paused — original: 5
    groups:
      npm-production:
        dependency-type: "production"
        patterns:
          - "*"
      npm-development:
        dependency-type: "development"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 0  # paused — original: 3
