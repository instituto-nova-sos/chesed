name: Frontend

# AUTOMATIC EXECUTION DISABLED (2026-06-03) — Phase 1 cost-control measure.
# Workflow stays in the repo so that re-enabling later is a one-line revert.
# To re-enable, replace the `on:` block below with the original push/pull_request
# triggers (see git history before commit that disabled triggers).
#
# Manual invocation remains possible via the Actions tab while paused.
# See CLAUDE.md "CI/CD Status — PAUSED" for the policy and re-enable steps.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "frontend/**"
  #     - ".github/workflows/frontend.yml"
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - "frontend/**"
  #     - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14
