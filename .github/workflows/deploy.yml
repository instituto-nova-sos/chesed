name: Deploy

# AUTOMATIC EXECUTION DISABLED (2026-06-03) — Phase 1 cost-control measure.
# Workflow stays in the repo so that re-enabling later is a one-line revert.
# To re-enable, replace the `on:` block below with the original push trigger
# (see git history before commit that disabled triggers).
#
# Manual invocation remains possible via the Actions tab while paused.
# See CLAUDE.md "CI/CD Status — PAUSED" for the policy and re-enable steps.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflows to pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT_SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          MAX_WAIT=600
          POLL_INTERVAL=30
          elapsed=0

          # Security always runs on every push to main
          REQUIRED_ALWAYS=("Security")
          # Backend and Frontend are path-filtered — only required if triggered
          REQUIRED_IF_TRIGGERED=("Backend" "Frontend")

          check_workflows() {
            local all_done=true

            for wf in "${REQUIRED_ALWAYS[@]}" "${REQUIRED_IF_TRIGGERED[@]}"; do
              run_json=$(gh run list --repo "$REPO" --commit "$COMMIT_SHA" \
                --workflow "$wf" --json status,conclusion --limit 1)

              if [ "$run_json" = "[]" ]; then
                # No run found for this commit
                local is_always=false
                for aw in "${REQUIRED_ALWAYS[@]}"; do
                  [ "$wf" = "$aw" ] && is_always=true
                done

                if $is_always; then
                  echo "ERROR: Required workflow '$wf' has no run for $COMMIT_SHA"
                  return 2
                fi
                echo "SKIP: '$wf' not triggered (no relevant path changes)"
                continue
              fi

              local status conclusion
              status=$(echo "$run_json" | jq -r '.[0].status')
              conclusion=$(echo "$run_json" | jq -r '.[0].conclusion')

              if [ "$status" != "completed" ]; then
                echo "WAIT: '$wf' is $status"
                all_done=false
                continue
              fi

              if [ "$conclusion" != "success" ]; then
                echo "FAIL: '$wf' concluded with '$conclusion'"
                return 1
              fi

              echo "PASS: '$wf'"
            done

            $all_done && return 0 || return 3
          }

          while true; do
            echo "--- Checking CI status (${elapsed}s elapsed) ---"
            set +e
            check_workflows
            result=$?
            set -e

            case $result in
              0) echo "All CI checks passed."; exit 0 ;;
              1) echo "A CI workflow failed. Aborting deploy."; exit 1 ;;
              2) echo "A required CI workflow was not triggered. Aborting."; exit 1 ;;
              3) ;; # still waiting
            esac

            elapsed=$((elapsed + POLL_INTERVAL))
            if [ $elapsed -ge $MAX_WAIT ]; then
              echo "Timed out waiting for CI after ${MAX_WAIT}s."
              exit 1
            fi
            echo "Waiting ${POLL_INTERVAL}s before next check..."
            sleep $POLL_INTERVAL
          done

  deploy:
    name: Deploy to Production
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 15m
          script: |
            cd /opt/chesed
            bash scripts/deploy.sh ${{ github.sha }}

      - name: External health check
        env:
          DOMAIN: ${{ secrets.DOMAIN_NAME }}
        run: |
          MAX_RETRIES=5
          RETRY_INTERVAL=15

          echo "==> Checking API health at https://$DOMAIN/api/v1/health"
          for i in $(seq 1 $MAX_RETRIES); do
            if curl -sf "https://$DOMAIN/api/v1/health"; then
              echo ""
              echo "API health check passed."
              break
            fi
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "FATAL: API not reachable after $((MAX_RETRIES * RETRY_INTERVAL))s."
              exit 1
            fi
            echo "  Retrying in ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done

          echo "==> Checking frontend at https://$DOMAIN/"
          if curl -sf -o /dev/null "https://$DOMAIN/"; then
            echo "Frontend health check passed."
          else
            echo "WARNING: Frontend returned non-200 (may redirect to Keycloak login)."
          fi
