# Chesed Development Environment
# Services: PostgreSQL 16, Keycloak 26, Go API, React dev server, Mailpit (SMTP), MinIO (S3)
# Ports: db=5432, keycloak=8180, api=8080, frontend=5173, mailpit=8025, minio=9000/9001
# Start: docker compose up
# Post-start: cd backend && make migrate-up && ./keycloak/init-realm.sh

services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: chesed
      POSTGRES_PASSWORD: chesed
      POSTGRES_DB: chesed
      # Password for the non-owner RLS app role (Sprint 9.1, Model A).
      POSTGRES_APP_PASSWORD: chesed_app
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/init-app-role.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chesed"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chesed-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/chesed_keycloak
      KC_DB_USERNAME: chesed
      KC_DB_PASSWORD: chesed
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - chesed-net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: chesed
      MINIO_ROOT_PASSWORD: chesed-dev-secret
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chesed-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      # The app connects as the non-owner RLS role (Sprint 9.1). Migrations run
      # as owner `chesed` via `make migrate-up` and bypass RLS.
      DATABASE_URL: postgres://chesed_app:chesed_app@db:5432/chesed?sslmode=disable
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: chesed
      KEYCLOAK_CLIENT_ID: chesed-pwa
      OIDC_SKIP_ISSUER_CHECK: "true"
      LOG_LEVEL: debug
      S3_ENDPOINT: minio:9000
      S3_BUCKET: chesed-docs
      S3_ACCESS_KEY: chesed
      S3_SECRET_KEY: chesed-dev-secret
      S3_USE_SSL: "false"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - chesed-net

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - chesed-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    networks:
      - chesed-net

networks:
  chesed-net:
    driver: bridge

volumes:
  pgdata:
  miniodata:
